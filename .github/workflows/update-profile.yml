name: Update Ember Command

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1,4"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'  #در صورت وجود requirements.txt کش پکیج‌ها فعال میشه

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # یا اگر پکیج خاصی بدون requirements داری:
          # pip install requests pillow

      - name: Generate profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate.py

      - name: Commit and Push Refreshed Assets
        run: |
          if git diff --quiet -- assets; then
            echo "No changes in assets to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile telemetry [skip ci]"
          git push
